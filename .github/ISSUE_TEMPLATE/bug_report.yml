name: Bug report
description: Something Boatdrill does wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Boatdrill version
      description: Settings → About, or the file name you downloaded.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Windows version and backup setup
      placeholder: Windows 11 24H2; external USB drive filled by FreeFileSync, OneDrive folder
  - type: textarea
    id: report
    attributes:
      label: The drill's report
      description: The sentence and score the app showed, or the output of boatdrill-cli. Strip anything private.
      render: text
